[workspace]
members = [
  "apps/api-gateway",
  "apps/agent-engine",
  "apps/connector-hub",
  "apps/auth-service",
  "apps/observability-service",
  "libs/core-types",
  "libs/db",
  "libs/secret-vault",
  "libs/llm-client",
  "libs/mcp-sdk",
  "libs/telemetry",
  "tools/schema-gen",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
schemars = { version = "0.8", features = ["uuid1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
